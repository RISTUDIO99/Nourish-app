name: Build Nourish Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-1.4.0-v6

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      NODE_ENV: production
      EXPO_PUBLIC_DOMAIN: meal-plan-demo.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
      NOURISH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      NOURISH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      NOURISH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Normalize standalone package dependencies
        run: |
          node <<'NODE'
          const fs = require("fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.devDependencies ??= {};
          packageJson.devDependencies.zod = "^3.25.76";
          packageJson.devDependencies["babel-preset-expo"] = "~54.0.12";
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate TypeScript
        run: pnpm run typecheck

      - name: Generate the native Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Restore the approved Android upload key
        shell: bash
        run: |
          printf '%s' '${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}' \
            | base64 --decode \
            >
