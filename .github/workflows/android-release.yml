name: Build Nourish Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-1.4.0-v6

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "true"
      EXPO_PUBLIC_DOMAIN: meal-plan-demo.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
      ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
      NOURISH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      NOURISH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      NOURISH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4

      - name: Validate required release secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY \
            EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY \
            ANDROID_UPLOAD_KEY_BASE64 \
            NOURISH_UPLOAD_STORE_PASSWORD \
            NOURISH_UPLOAD_KEY_PASSWORD \
            NOURISH_UPLOAD_KEY_ALIAS
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Normalize standalone package dependencies
        run: |
          node <<'NODE'
          const fs = require("fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.dependencies ??= {};
          packageJson.devDependencies ??= {};

          for (const [name, version] of Object.entries({
            expo: "~54.0.37",
            react: "19.1.0",
            "react-native": "0.81.5",
          })) {
            packageJson.dependencies[name] = version;
            delete packageJson.devDependencies[name];
          }

          packageJson.devDependencies.zod = "^3.25.76";
          packageJson.devDependencies["babel-preset-expo"] = "~54.0.12";
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile --prod=false

      - name: Validate TypeScript
        run: pnpm run typecheck

      - name: Validate Expo dependency versions
        run: pnpm exec expo install --check

      - name: Generate the native Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Restore the approved Android upload key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_UPLOAD_KEY_BASE64" \
            | base64 --decode \
            > android/app/nourish-upload-key.jks
          chmod 600 android/app/nourish-upload-key.jks
          test -s android/app/nourish-upload-key.jks

      - name: Configure release signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_block = """
                  release {
                      storeFile file("nourish-upload-key.jks")
                      storePassword System.getenv("NOURISH_UPLOAD_STORE_PASSWORD")
                      keyAlias System.getenv("NOURISH_UPLOAD_KEY_ALIAS")
                      keyPassword System.getenv("NOURISH_UPLOAD_KEY_PASSWORD")
                  }
          """

          marker = "    signingConfigs {\n"
          if marker not in text:
              raise SystemExit("Could not find Android signingConfigs block")
          text = text.replace(marker, marker + signing_block, 1)

          pattern = re.compile(
              r"(buildTypes\s*\{.*?release\s*\{.*?signingConfig\s+)"
              r"signingConfigs\.debug",
              re.DOTALL,
          )
          text, replacements = pattern.subn(
              r"\1signingConfigs.release",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not select release signing configuration")

          path.write_text(text)
          PY

      - name: Confirm upload certificate before building
        shell: bash
        run: |
          EXPECTED="A2:99:A9:54:2E:55:80:E0:C3:86:69:E4:34:20:F6:E7:43:F7:14:DA"
          ACTUAL="$(
            keytool \
              -list \
              -v \
              -keystore android/app/nourish-upload-key.jks \
              -storepass "$NOURISH_UPLOAD_STORE_PASSWORD" \
              -alias "$NOURISH_UPLOAD_KEY_ALIAS" \
              | awk -F'SHA1: ' '/SHA1:/{print $2; exit}'
          )"
          test "$ACTUAL" = "$EXPECTED"
          
      - name: Build the signed App Bundle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew app:bundleRelease --no-daemon --max-workers=2 --stacktrace \
            2>&1 | tee ../gradle-build.log

      - name: Upload Gradle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nourish-android-gradle-failure
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
     
      - name: Verify and name the release bundle
        shell: bash
        run: |
          SOURCE="android/app/build/outputs/bundle/release/app-release.aab"
          OUTPUT="Nourish-1.4.0-version-code-6.aab"
          EXPECTED="A2:99:A9:54:2E:55:80:E0:C3:86:69:E4:34:20:F6:E7:43:F7:14:DA"

          test -s "$SOURCE"
          jarsigner -verify -strict "$SOURCE" >/dev/null
          ACTUAL="$(
            keytool -printcert -jarfile "$SOURCE" \
              | awk -F'SHA1: ' '/SHA1:/{print $2; exit}'
          )"
          test "$ACTUAL" = "$EXPECTED"
          cp "$SOURCE" "$OUTPUT"

      - name: Upload the verified App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nourish-1.4.0-version-code-6
          path: Nourish-1.4.0-version-code-6.aab
          if-no-files-found: error
          retention-days: 14
